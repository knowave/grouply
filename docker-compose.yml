services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grouply-backend
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: admin
    ports:
      - "1111:8080"
    networks:
      - grouply-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grouply-frontend
    depends_on:
      - backend
    ports:
      - "1212:80"
    networks:
      - grouply-network

networks:
  grouply-network:
    driver: bridge
